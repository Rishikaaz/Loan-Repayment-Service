name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: loan_repayment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize Database Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/loan_repayment_test
          DATABASE_SSL: 'false'
        run: npm run db:init

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/loan_repayment_test
          DATABASE_SSL: 'false'
          ALLOW_TEST_TOKENS: 'true'
          NODE_ENV: test
        run: npm test
